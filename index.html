<script>

const API_URL='https://script.google.com/macros/s/AKfycbxt85X-0axTGQI1RnNG1yYYfh6HeIOcta-fZJwsPvomPl_mLrBRiqWoZnaNjuAw3p17CQ/exec';
let poolCache=[];
function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='gglJsonp_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  const timer=setTimeout(()=>{cleanup();reject(new Error('Apps Script request timed out.'))},20000);
  function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}
  window[cb]=data=>{cleanup();resolve(data)};
  script.onerror=()=>{cleanup();reject(new Error('Could not connect to Apps Script. Check deployment access.'))};
  script.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();
  document.head.appendChild(script);
 });
}
function postToAppsScript(payload){
 return new Promise((resolve,reject)=>{
  const frame=document.createElement('iframe');
  frame.name='ggl_post_'+Date.now();
  frame.style.display='none';
  const form=document.createElement('form');
  form.method='POST';form.action=API_URL;form.target=frame.name;
  form.style.display='none';
  const input=document.createElement('input');
  input.name='payload';input.value=JSON.stringify(payload);input.type='hidden';
  form.appendChild(input);document.body.appendChild(frame);document.body.appendChild(form);
  let settled=false;
  frame.onload=()=>{if(!settled){settled=true;setTimeout(()=>{form.remove();frame.remove();resolve(true)},900)}};
  form.submit();
  setTimeout(()=>{if(!settled){settled=true;form.remove();frame.remove();reject(new Error('Apps Script did not respond within 60 seconds. Check the Apps Script execution log and web-app deployment.'))}},60000);
 });
}
function mapEmployee(e){
 return {name:e.employeeName||e.name||'',id:e.employeeCode||e.employeeId||e.id||'',
  department:e.department||'',designation:e.designation||'',branch:'',
  recordId:e.recordId||'',formNo:$('formNo').value.trim()||'GL-HR-FRM-001-01',date:today()};
}
async function searchPool(){
 const q=$('poolSearch').value.trim();
 $('status').textContent='Searching Employee Pool…';
 try{
  const res=await jsonp({action:'pool',q});
  if(!res.ok)throw new Error(res.error||'Pool search failed.');
  poolCache=res.employees||[];
  $('poolSelect').innerHTML='<option value="">Select employee…</option>'+poolCache.map((e,i)=>
   `<option value="${i}">${esc(e.employeeCode||'')} — ${esc(e.employeeName||'')} (${esc(e.branch||'')})</option>`).join('');
  $('status').textContent=`Loaded ${poolCache.length} employee record(s) from Google Sheets.`;
 }catch(err){$('status').textContent=err.message}
}
function useSelectedEmployee(){
 const i=$('poolSelect').value;
 if(i===''){ $('status').textContent='Select an employee from the pool first.';return null}
 const r=mapEmployee(poolCache[Number(i)]);
 $('empName').value=r.name;$('empId').value=r.id;$('department').value=r.department;
 $('designation').value=r.designation;$('branch').value='';$('date').value=today();
 $('status').textContent=`Selected ${r.name} (${r.id}).`;
 return r;
}
async function generateFromPool(action='generate'){
 const r=useSelectedEmployee();if(!r)return;
 try{
  $('status').textContent='Recording form generation in Google Sheets…';
  await postToAppsScript({action,employeeCode:r.id,notes:action==='reprint'?'Reprint requested from GitHub frontend':'Generated from GitHub frontend'});
  const found=await jsonp({action:'employee',employeeCode:r.id});
  if(!found.ok||!found.employee)throw new Error(found.error||'Employee record could not be retrieved.');
  const record=mapEmployee(found.employee);
  record.recordId=found.employee.recordId;
  allocated=[record];render(allocated);
  $('status').textContent='Form ready. Print or save as PDF.';
  window.print();
 }catch(err){$('status').textContent='Could not generate form: '+err.message}
}

const $=id=>document.getElementById(id);let records=[];let allocated=[];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('date').value=today();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function csvDownload(filename,rows){const content='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadTemplate(){csvDownload('GGL_Specimen_Signature_Bulk_Template.csv', [['Employee Name','Employee ID','Department','Designation','Branch','Date','Format / Annexure No.'],['Sample Employee','GGL-EMP-0001','Operations','Executive','','', $('formNo').value]])}
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v);rows.push(row);row=[];v=''}else if(c!=='\r')v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
function code39Svg(value){
 const map={
 '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',

 'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
 'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwnnwnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};

$('upload').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const rows=parseCSV(await f.text());
  if(rows.length<2){$('status').textContent='No employee rows found. Use the downloaded CSV template.';return}
  const headers=rows[0].map(x=>x.trim().toLowerCase());
  const idx=(...names)=>headers.findIndex(x=>names.includes(x));
  const col={name:idx('employee name','name'),id:idx('employee id','employeeid'),department:idx('department'),designation:idx('designation'),date:idx('date'),formNo:idx('format / annexure no.','format no','form no')};
  if(col.name<0||col.id<0){$('status').textContent='CSV must contain Employee Name and Employee ID columns.';return}
  const parsed=rows.slice(1).filter(row=>row.some(x=>x.trim())).map(row=>({
   name:(row[col.name]||'').trim(),id:(row[col.id]||'').trim(),
   department:col.department>=0?(row[col.department]||'').trim():'',
   designation:col.designation>=0?(row[col.designation]||'').trim():'',
   branch:'',date:col.date>=0?(row[col.date]||'').trim():today(),
   formNo:col.formNo>=0?(row[col.formNo]||'').trim():$('formNo').value.trim()
  })).filter(r=>r.name&&r.id);
  if(!parsed.length){$('status').textContent='No valid employee rows. Name and Employee ID are required.';return}
  const seenEmployees=new Set(),seenFormEmployee=new Set(),unique=[];
  let duplicateInFile=0;
  parsed.forEach(r=>{
   const employeeKey=r.id.toLowerCase();
   const formEmployeeKey=(r.formNo||$('formNo').value.trim()||'GL-HR-FRM-001-01').toLowerCase()+'|'+employeeKey;
   if(seenEmployees.has(employeeKey)||seenFormEmployee.has(formEmployeeKey)){duplicateInFile++;return}
   seenEmployees.add(employeeKey);seenFormEmployee.add(formEmployeeKey);unique.push(r);
  });
  allocated=[];let skippedExisting=0,created=0;
  for(let i=0;i<unique.length;i++){
   const r=unique[i];$('status').textContent=`Checking employee ${i+1} of ${unique.length}: ${r.id}`;
   let found=await jsonp({action:'employee',employeeCode:r.id});
   if(found.ok&&found.employee){
    skippedExisting++;
    continue;
   }
   const createResult=await postToAppsScript({action:'create',employee:{employeeCode:r.id,employeeName:r.name,designation:r.designation,department:r.department,branch:'',email:''}});
   if(!createResult||!createResult.ok){
    // Concurrent/imported duplicate: treat as already present and skip safely.
    if(createResult&&createResult.duplicate){skippedExisting++;continue}
    throw new Error(`Could not create employee ${r.id}: ${(createResult&&createResult.error)||'No backend confirmation received.'}`);
   }
   const saved=createResult.employee;
   if(!saved||!saved.recordId)throw new Error(`Backend did not return a permanent Record ID for ${r.id}.`);
   created++;
   const generated=await postToAppsScript({action:'generate',employeeCode:r.id,notes:'Bulk form generated from CSV upload'});
   if(!generated||!generated.ok)throw new Error(`Employee ${r.id} was registered, but form generation failed: ${(generated&&generated.error)||'No backend confirmation received.'}`);
   allocated.push({name:saved.employeeName||r.name,id:saved.employeeCode||r.id,department:saved.department||r.department,designation:saved.designation||r.designation,branch:'',recordId:saved.recordId,formNo:r.formNo||$('formNo').value.trim()||'GL-HR-FRM-001-01',date:r.date||today()});
  }
  records=allocated;render(allocated);$('bulkPanel').classList.remove('hide');
  $('bulkCount').textContent=`${allocated.length} new forms ready; ${skippedExisting} existing employee(s) skipped; ${duplicateInFile} duplicate CSV row(s) skipped.`;
  $('status').textContent=allocated.length
   ?`Ready to print ${allocated.length} new employee form(s). Existing employees were skipped.`
   :`No new forms prepared. Existing employees: ${skippedExisting}; duplicate rows: ${duplicateInFile}.`;
 }catch(err){$('status').textContent='Bulk preparation failed: '+err.message}
 finally{e.target.value=''}
};
$('printAll').onclick=()=>{if(!allocated.length){alert('Upload a CSV first.');return}render(allocated);window.print()};$('downloadCurrentRegister').onclick=()=>{if(!allocated.length)return;csvDownload('GGL_Bulk_Specimen_Signature_Register.csv',[['Record ID','Employee Name','Employee ID','Department','Designation','Branch','Date','Format / Annexure No.'],...allocated.map(r=>[r.recordId,r.name,r.id,r.department,r.designation,r.branch,r.date,r.formNo])])};$('exportRegister').onclick=()=>{const saved=JSON.parse(localStorage.getItem('gglSpecimenRegister')||'[]');csvDownload('GGL_Allocated_Register.csv',[['Record ID','Employee Name','Employee ID'],...saved.map(r=>[r.recordId,r.name,r.id])])};$('resetFormNo').onclick=()=>{$('formNo').value='GL-HR-FRM-001-01';$('status').textContent='Format / Annexure No. reset to GL-HR-FRM-001-01.'};
$('clear').onclick=()=>{['empName','empId','department','designation','branch'].forEach(k=>$(k).value='');$('date').value=today();$('formNo').value='GL-HR-FRM-001-01';$('status').textContent='Fields cleared and Form No. reset.'};
</script></body></html>
